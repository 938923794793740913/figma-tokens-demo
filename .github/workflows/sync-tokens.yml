name: Sync Figma Tokens to Code

on:
  push:
    paths:
      - 'tokens.json'

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Transform Tokens
        run: npm run build

      - name: Commit Updated Code
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "style(design-tokens): Auto-sync design tokens from Figma [skip ci]"
          file_pattern: 'tokens.css'
