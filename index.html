<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Rectangle Token Sync</title>
  <link rel="stylesheet" href="./globals.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .figma-rectangle {
      width: var(--rect-width, 546px);
      height: var(--rect-height, 233px);
      background-color: var(--rect-color, #c11f1f);
      border-radius: var(--rect-radius, 24px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>
  <div class="figma-rectangle"></div>
</body>
</html>
