<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noble Finances - Clean Figma Sync</title>
  <link rel="stylesheet" href="./globals.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--color-bg-main, #a0f1bd);
      color: var(--color-text-main, #2d4f20);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .hero-card {
      background-color: var(--color-bg-dark, #2e4f21);
      color: var(--color-text-light, #ffffff);
      padding: 48px;
      border-radius: var(--radius-card, 20px);
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .badge {
      background-color: var(--color-accent, #d2f8dc);
      color: var(--color-text-main, #2d4f20);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-block;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    p {
      color: var(--color-text-muted, #7d9276);
      font-size: 1rem;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .btn {
      background-color: var(--color-bg-main, #a0f1bd);
      color: var(--color-text-main, #2d4f20);
      border: none;
      padding: 16px 32px;
      border-radius: var(--radius-btn, 12px);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.02);
    }
  </style>
</head>
<body>
  <div class="hero-card">
    <span class="badge">NOBLE FINANCES</span>
    <h1>Financial Clarity You Can Trust</h1>
    <p>Trusted financial guidance for every stage of life and business since 1987.</p>
    <button class="btn">Connect with our experts</button>
  </div>
</body>
</html>
