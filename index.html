<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Pixel-Perfect Render</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px;
    }
    .desktop-canvas {
      position: relative;
      width: 1440.0px;
      height: 1024.0px;
      background-color: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="desktop-canvas">
    <div style="position: absolute; left: 447.0px; top: 396.0px; width: 546.0px; height: 233.0px; background-color: rgba(193, 31, 31, 1.0); border-radius: 24.0px;"></div><div style="position: absolute; left: 115.0px; top: 71.0px; width: 308.0px; height: 325.0px; background-color: rgba(217, 217, 217, 1.0); border-radius: 0px;"></div><div style="position: absolute; left: 1047.0px; top: 71.0px; width: 308.0px; height: 325.0px; background-color: rgba(217, 217, 217, 1.0); border-radius: 0px;"></div>
  </div>
</body>
</html>
