<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Tokens Auto-Sync Demo</title>
  <link rel="stylesheet" href="./tokens.css">
  <style>
    body {
      background-color: var(--color-bg, #0f172a);
      color: var(--color-text, #f8fafc);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      transition: all 0.3s ease;
    }

    .card {
      background-color: var(--color-cardBg, #1e293b);
      border-radius: var(--radius-card, 16px);
      padding: var(--spacing-lg, 24px);
      max-width: 320px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .card-title {
      margin: 0 0 var(--spacing-sm, 8px) 0;
      font-size: 1.25rem;
    }

    .card-desc {
      color: var(--color-textMuted, #94a3b8);
      font-size: 0.875rem;
      margin-bottom: var(--spacing-lg, 24px);
    }

    .btn {
      background-color: var(--color-primary, #3b82f6);
      color: #ffffff;
      border: none;
      padding: var(--spacing-md, 16px) var(--spacing-lg, 24px);
      border-radius: var(--radius-btn, 8px);
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="card-title">Figma Auto-Sync</h2>
    <p class="card-desc">این کامپوننت مستقیماً متغیرهای رنگ و ابعاد خود را از توکن‌های فیگما دریافت می‌کند.</p>
    <button class="btn">دکمه اکشن فیگما</button>
  </div>
</body>
</html>
